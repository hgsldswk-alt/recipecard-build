name: RecipeCard
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.recipecard
    APP_STORE_ID: "6836803347"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  RecipeCard:
    type: application
    platform: iOS
    sources: [RecipeCard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: RecipeCard AppStore
    info:
      path: RecipeCard/Info.plist
      properties:
        CFBundleDisplayName: 食谱卡
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        RecipeProProductID: $(APP_ID).pro
        RecipeTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.recipecard.recipe
            UTTypeDescription: Recipe Card
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [recipecard]
              public.mime-type: [application/vnd.hgsldswk.recipecard+json]
          - UTTypeIdentifier: com.hgsldswk.recipecard.backup
            UTTypeDescription: Recipe Card Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [recipebackup]
              public.mime-type: [application/vnd.hgsldswk.recipebackup]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Recipe Card
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.recipecard.recipe]
          - CFBundleTypeName: Recipe Card Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.recipecard.backup]
  RecipeCardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RecipeCardTests]
    dependencies:
      - target: RecipeCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  RecipeCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RecipeCardUITests]
    dependencies:
      - target: RecipeCard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RecipeCard
schemes:
  RecipeCard:
    build:
      targets:
        RecipeCard: all
        RecipeCardTests: [test]
    test:
      config: Debug
      targets: [RecipeCardTests]
  RecipeCardUI:
    build:
      targets:
        RecipeCard: all
        RecipeCardUITests: [test]
    test:
      config: Debug
      targets: [RecipeCardUITests]
